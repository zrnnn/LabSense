name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tools/build_portal_assets.py --check
      - run: python tools/check_distribution.py
      - run: python -m esphome config firmware/release/labsense.yaml
      - run: python tools/build_release.py
      - run: python tools/check_distribution.py --build
