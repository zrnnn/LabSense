<text x="810" y="536" class="sub">SCL: D5 / GPIO7</text>
<text x="65" y="700" class="label">Before powering: compare the delivered board labels with the carrier.</text>
<text x="65" y="735" class="sub">OLED versions with VCC–GND–SCL–SDA swap the power pins and do not fit electrically.</text>
<text x="65" y="770" class="sub">Confirm body size, glass position and header height separately. Research: 16 October 2026.</text>
